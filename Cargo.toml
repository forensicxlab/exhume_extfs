[package]
name = "exhume_extfs"
version = "0.1.18"
edition = "2021"
description = "Extract Extended Filesystem specific artefacts from a Partition."
documentation = "https://www.forensicxlab.com/docs/category/exhume---extfs"
authors = ["k1nd0ne"]
repository = "https://github.com/forensicxlab/exhume_extfs"
license = "GPL-3.0-only"
readme = "README.md"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
exhume_body = "=0.5.7"
byteorder = "1.4"
log = "0.4.25"
clap = { version = "4.5", features = ["cargo"] }
clap-num = "1.1.1"
prettytable-rs = "^0.10"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
env_logger = "0.11.6"
